
name: Update GE6 Data

on:
  # Run every day at 06:15 Thailand time (UTC+7)
  schedule:
    - cron: "*/30 * * * *"

  # Allow manual runs from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ge6-data-pipeline
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
        

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run extraction
        run: python extract.py

      - name: Run transformation
        run: python transform.py

      
      - name: Record successful pipeline run
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          status_path = Path("data/persist/pipeline_status.json")
          status_path.parent.mkdir(parents=True, exist_ok=True)

          status = {
              "status": "success",
              "last_successful_run": datetime.now(
                  ZoneInfo("Asia/Bangkok")
              ).isoformat()
          }

          status_path.write_text(
              json.dumps(status, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/GE6_txn.parquet
          git add data/curate/GE6_txn_processed.parquet
          git add data/curate/daily_balance_sheet.parquet
          git add data/persist/daily_overview.parquet

          if ! git diff --cached --quiet; then
            git commit -m "chore: update GE6 data"
            git push origin HEAD:main
          else
            echo "No data changes to commit."
          fi
        